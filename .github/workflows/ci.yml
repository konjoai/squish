name: CI

# Essential checks only: the Python test suite on Linux.
# Docs-only changes (docs/**, *.md) skip it; Deploy Docs handles those.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-timeout

      - name: Run tests (MLX tests auto-skip on Linux)
        # test_int4_loader.py needs the squish_quant Rust extension (cargo/maturin).
        # test_git_integration.py needs live model weights.
        run: |
          pytest tests/ \
            --ignore=tests/quant/test_int4_loader.py \
            --ignore=tests/test_git_integration.py \
            --timeout=60 -q --tb=short
